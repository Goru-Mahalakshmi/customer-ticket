{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-chart-bar me-2"></i>Reports & Analytics</h1>
    <a href="{{ url_for('admin.export_tickets') }}" class="btn btn-success">
        <i class="fas fa-download me-1"></i>Export Data
    </a>
</div>

<div class="row mb-4">
    <!-- Ticket Status Distribution -->
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Ticket Status Distribution</h5>
            </div>
            <div class="card-body">
                <canvas id="statusChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <!-- Priority Distribution -->
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Priority Distribution</h5>
            </div>
            <div class="card-body">
                <canvas id="priorityChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mb-4">
    <!-- Category Distribution -->
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Category Distribution</h5>
            </div>
            <div class="card-body">
                <canvas id="categoryChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <!-- Performance Metrics -->
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Performance Metrics</h5>
            </div>
            <div class="card-body">
                <div id="performanceMetrics">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Timeline Chart -->
<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0">Tickets Created Timeline (Last 30 Days)</h5>
    </div>
    <div class="card-body">
        <canvas id="timelineChart" width="400" height="150"></canvas>
    </div>
</div>

<script src="{{ url_for('static', filename='js/reports.js') }}"></script>
{% endblock %}

{% block scripts %}
<script>
// Load reports when page is ready
document.addEventListener('DOMContentLoaded', function() {
    loadReports();
});
</script>
{% endblock %}
